        type: code
        title: 整理引擎摘要
        code_language: python3
        code: "def main(tool_json):\n    analysis = tool_json[0] if isinstance(tool_json, list) and tool_json else tool_json\n    if not isinstance(analysis, dict):\n        return {\"engine_summary\": \"引擎没有返回可读取的分析数据。\"}\n\n    items = analysis.get(\"top_divergences\") or []\n    lines = [\n        \"结果: \" + str(analysis.get(\"result\", \"未知\")),\n        \"总半回合数: \" + str(analysis.get(\"num_moves\", \"未知\")),\n        \"终局 FEN: \" + str(analysis.get(\"final_fen\", \"未知\")),\n        \"关键分歧（按胜率损失从大到小）:\",\n    ]\n    for item in items[:5]:\n        lines.append(\n            \"- 第{move_no}回合 {side}走{move}；分类={classification}；建议={best_before}；胜率损失={win_loss}%（{winpct_before}%→{winpct_after}%）\".format(\n                move_no=item.get(\"move_no\", \"?\"),\n                side=\"白方\" if item.get(\"side\") == \"white\" else \"黑方\",\n                move=item.get(\"move\", \"?\"),\n                classification=item.get(\"classification\", \"未知\"),\n                best_before=item.get(\"best_before\", \"未知\"),\n                win_loss=item.get(\"win_loss\", \"未知\"),\n                winpct_before=item.get(\"winpct_before\", \"未知\"),\n                winpct_after=item.get(\"winpct_after\", \"未知\"),\n            )\n        )\n    return {\"engine_summary\": \"\\n\".join(lines)}"
        variables:
